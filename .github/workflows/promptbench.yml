name: promptbench CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 to silence the Node 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-flight runs for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Unit tests — runs on every push and PR
  # No API key required.
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Save baseline — runs only on push to main.
  # Calls the real LLM and caches the SQLite baseline
  # so regression tests on PRs can use it.
  #
  # NOTE: baseline mode does not run evaluators, so the
  # HuggingFace model is NOT downloaded here. It is
  # cached in the regression-tests job instead.
  # ─────────────────────────────────────────────
  save-baseline:
    name: Save Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Save baselines for all example suites
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          promptbench baseline --suite examples/summarizer.yaml
          promptbench baseline --suite examples/classifier.yaml
          promptbench baseline --suite examples/chatbot.yaml

      - name: Cache baseline database
        uses: actions/cache/save@v4
        with:
          path: ~/.promptbench/db.sqlite
          key: promptbench-baseline-${{ runner.os }}-${{ hashFiles('examples/*.yaml') }}-${{ github.sha }}

  # ─────────────────────────────────────────────
  # Job 3: Regression tests — runs only on PRs.
  # Restores the baseline saved on main, then tests
  # whether the PR's prompts still behave correctly.
  # The HuggingFace model is cached here because
  # `promptbench test` is the first command that
  # downloads it (semantic evaluator).
  # ─────────────────────────────────────────────
  regression-tests:
    name: Prompt Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore baseline database
        uses: actions/cache/restore@v4
        with:
          path: ~/.promptbench/db.sqlite
          # Falls back to the most recent baseline if the exact key isn't found
          key: promptbench-baseline-${{ runner.os }}-${{ hashFiles('examples/*.yaml') }}
          restore-keys: |
            promptbench-baseline-${{ runner.os }}-

      - name: Fail early if no baseline exists
        run: |
          if [ ! -f "$HOME/.promptbench/db.sqlite" ]; then
            echo "::error::No baseline found. Push to main first to generate one."
            exit 1
          fi
          echo "Baseline restored successfully ($(du -h $HOME/.promptbench/db.sqlite | cut -f1))"

      - name: Restore HuggingFace model cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      - name: Run prompt regression tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          promptbench test --suite examples/summarizer.yaml
          promptbench test --suite examples/classifier.yaml
          promptbench test --suite examples/chatbot.yaml

      - name: Cache HuggingFace model for future runs
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      - name: Generate HTML failure report
        if: failure()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          promptbench report --suite examples/summarizer.yaml --format html --output summarizer_report.html || true
          promptbench report --suite examples/classifier.yaml --format html --output classifier_report.html || true
          promptbench report --suite examples/chatbot.yaml    --format html --output chatbot_report.html    || true

      - name: Upload failure reports as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promptbench-failure-reports
          path: "*_report.html"
          retention-days: 7
