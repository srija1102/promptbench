[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptbench"
version = "0.1.0"
description = "A prompt regression testing framework for LLMs — catch regressions before they reach production"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "promptbench contributors" }]
keywords = ["llm", "prompt", "testing", "regression", "ai", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/promptbench"
Documentation = "https://github.com/your-org/promptbench#readme"
Repository = "https://github.com/your-org/promptbench.git"
Issues = "https://github.com/your-org/promptbench/issues"

[project.scripts]
promptbench = "promptbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["promptbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -W ignore::pytest.PytestCollectionWarning"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"
